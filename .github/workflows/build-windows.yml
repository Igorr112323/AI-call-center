name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Run backend test suite
        shell: bash
        run: |
          set +e
          python -m pytest tests --ignore=tests/ui_smoke.py -q --junitxml=pytest.xml 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          if [ "$status" != "0" ]; then
            python -c "import xml.etree.ElementTree as ET; root=ET.parse('pytest.xml').getroot(); fails=[]; [fails.append((tc.get('classname','')+'.'+tc.get('name','')+': '+(el.text or '')[:400])) for tc in root.iter('testcase') for el in tc if el.tag in ('failure','error')]; print('::error title=pytest failures::' + ' || '.join(fails)[:1500])"
          fi
          exit $status

      - name: Render raster assets and application icon
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/build_assets.py

      - name: Headless self-check before packaging
        run: python run.py --selfcheck

      - name: Download Piper neural Russian voice (Irina, ONNX)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/resources/piper
          BASE="https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/ru/ru_RU/irina/medium"
          curl -L --fail --retry 3 --retry-delay 2 \
            -o app/resources/piper/ru_RU-irina-medium.onnx \
            "$BASE/ru_RU-irina-medium.onnx"
          curl -L --fail --retry 3 --retry-delay 2 \
            -o app/resources/piper/ru_RU-irina-medium.onnx.json \
            "$BASE/ru_RU-irina-medium.onnx.json"
          ls -la app/resources/piper
          python -c "import os; m='app/resources/piper/ru_RU-irina-medium.onnx'; s=os.path.getsize(m); assert s > 10_000_000, f'model too small: {s} bytes'; print('Piper model OK:', round(s/1e6,1), 'MB')"

      - name: Verify Piper neural voice synthesizes Russian
        shell: powershell
        run: |
          $py = @'
          import asyncio
          import sys
          import traceback
          try:
              sys.stdout.reconfigure(encoding="utf-8", errors="replace")
              sys.stderr.reconfigure(encoding="utf-8", errors="replace")
              from app.config import TtsConfig
              from app.voice.piper_tts import PiperTts, piper_model_paths
              assert piper_model_paths() is not None, "model files missing"
              tts = PiperTts(TtsConfig(provider="piper", sample_rate=24000, speed=1.0))
              phrase = "\u0417\u0434\u0440\u0430\u0432\u0441\u0442\u0432\u0443\u0439\u0442\u0435! \u042d\u0442\u043e \u043f\u0440\u043e\u0432\u0435\u0440\u043a\u0430 \u043d\u0435\u0439\u0440\u043e\u0441\u0435\u0442\u0435\u0432\u043e\u0433\u043e \u0433\u043e\u043b\u043e\u0441\u0430 \u0418\u0440\u0438\u043d\u0430."
              pcm = asyncio.run(tts.synthesize(phrase))
              print("Piper PCM bytes:", len(pcm), flush=True)
              assert len(pcm) > 20000, "neural synthesis produced too little audio"
              print("Piper neural smoke OK", flush=True)
          except Exception:
              msg = " | ".join(traceback.format_exc().splitlines())[:1450]
              print(f"::error title=Piper neural smoke failed::{msg}", flush=True)
              raise
          '@
          Set-Content -Path "$env:TEMP\piper_smoke.py" -Value $py -Encoding utf8
          $env:PYTHONPATH = (Get-Location).Path
          $ErrorActionPreference = "Continue"
          $proc = Start-Process -FilePath "python" `
            -ArgumentList "-u `"$env:TEMP\piper_smoke.py`"" `
            -Wait -PassThru -NoNewWindow `
            -RedirectStandardOutput "$env:TEMP\piper_smoke.out" `
            -RedirectStandardError "$env:TEMP\piper_smoke.err"
          if ($proc.ExitCode -ne 0) {
            $joined = ((Get-Content "$env:TEMP\piper_smoke.out", "$env:TEMP\piper_smoke.err" `
              -ErrorAction SilentlyContinue) -join " | ")
            if ($joined.Length -gt 1400) { $joined = $joined.Substring($joined.Length - 1400) }
            Write-Host "::error title=Piper neural smoke failed::$joined"
            throw "Piper neural smoke failed (see annotation)"
          }
          Get-Content "$env:TEMP\piper_smoke.out", "$env:TEMP\piper_smoke.err" `
            -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }

      - name: Verify in-process SAPI voice (comtypes, no process spawn)
        shell: powershell
        run: |
          $py = @'
          import sys
          import traceback
          try:
              sys.stdout.reconfigure(encoding="utf-8", errors="replace")
              sys.stderr.reconfigure(encoding="utf-8", errors="replace")
              import comtypes
              import comtypes.client as cc
              print("comtypes", getattr(comtypes, "__version__", "?"), flush=True)
              probe = cc.CreateObject("SAPI.SpVoice", dynamic=True)
              voices = probe.GetVoices("")
              print("installed voices:", voices.Count, flush=True)
              from app.voice.sapi_com import NativeSapiError, NativeSapiRenderer, decode_wav
              r = NativeSapiRenderer(rate=1)
              # English phrase validates the rendering mechanics on en-only runners
              wav = r.render_wav("Hello world, this is a voice engine test")
              pcm, rate, ch = decode_wav(wav)
              print(f"Native SAPI WAV: {len(wav)} bytes, {rate} Hz, {len(pcm)} PCM bytes", flush=True)
              assert rate > 0 and len(pcm) > 1000
              # Russian is best-effort here: Cyrillic yields no frames without
              # an installed Russian desktop voice (real Russian Windows has one)
              ru = "\u041f\u0440\u043e\u0432\u0435\u0440\u043a\u0430 \u0433\u043e\u043b\u043e\u0441\u043e\u0432\u043e\u0433\u043e \u0434\u0432\u0438\u0436\u043a\u0430"
              try:
                  ru_pcm = decode_wav(r.render_wav(ru))[0]
                  print("Russian phrase frames:", len(ru_pcm), flush=True)
              except NativeSapiError as exc:
                  print("Russian render skipped on en-only runner:", exc, flush=True)
              print("Native SAPI smoke OK", flush=True)
          except Exception:
              msg = " | ".join(traceback.format_exc().splitlines())[:1450]
              print(f"::error title=SAPI native smoke failed::{msg}", flush=True)
              raise
          '@
          Set-Content -Path "$env:TEMP\sapi_native_smoke.py" -Value $py -Encoding utf8
          $env:PYTHONPATH = (Get-Location).Path
          $ErrorActionPreference = "Continue"
          $proc = Start-Process -FilePath "python" `
            -ArgumentList "-u `"$env:TEMP\sapi_native_smoke.py`"" `
            -Wait -PassThru -NoNewWindow `
            -RedirectStandardOutput "$env:TEMP\sapi_native.out" `
            -RedirectStandardError "$env:TEMP\sapi_native.err"
          if ($proc.ExitCode -ne 0) {
            $joined = ((Get-Content "$env:TEMP\sapi_native.out", "$env:TEMP\sapi_native.err" `
              -ErrorAction SilentlyContinue) -join " | ")
            if ($joined.Length -gt 1400) { $joined = $joined.Substring($joined.Length - 1400) }
            Write-Host "::error title=SAPI native smoke failed::$joined"
            throw "Native SAPI smoke failed (see annotation)"
          }
          # preserve line boundaries so ::warning/::error commands parse
          Get-Content "$env:TEMP\sapi_native.out", "$env:TEMP\sapi_native.err" `
            -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }
      - name: Verify SAPI PowerShell fallback path
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Speech
          $out = Join-Path $env:TEMP "sapi_smoke.wav"
          $s = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $s.SetOutputToWaveFile($out)
          $s.Speak("Проверка голосового движка")
          $s.Dispose()
          if (-not (Test-Path $out) -or (Get-Item $out).Length -lt 1000) {
            throw "SAPI did not produce a valid WAV"
          }
          Write-Host "SAPI fallback OK, WAV size: $((Get-Item $out).Length) bytes"

      - name: Build onefile executable
        run: pyinstaller VoiceSalesAgent.spec --noconfirm

      - name: Smoke-run the packaged executable
        shell: powershell
        run: |
          $proc = Start-Process -FilePath ".\dist\VoiceSalesAgent.exe" `
            -ArgumentList "--selfcheck" -Wait -PassThru `
            -RedirectStandardOutput "selfcheck.out" -RedirectStandardError "selfcheck.err"
          Write-Host "exe selfcheck exit code: $($proc.ExitCode)"
          Get-Content selfcheck.out, selfcheck.err -ErrorAction SilentlyContinue
          if ($proc.ExitCode -ne 0) {
            $log = Join-Path $env:TEMP "voice_sales_selfcheck.log"
            if (Test-Path $log) {
              $joined = ((Get-Content $log) -join " | ")
              if ($joined.Length -gt 1500) { $joined = $joined.Substring(0, 1500) }
              Write-Host "::error::$joined"
            }
            throw "Packaged exe selfcheck failed"
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceSalesAgent-exe
          path: dist/VoiceSalesAgent.exe
          if-no-files-found: error

      - name: Publish GitHub release on tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES="Сборка Windows (.exe, onefile). Запустите VoiceSalesAgent.exe — установка не требуется. Демо без микрофона: кнопка «Текстовый тест», демо-каталоги во вкладке «Источник данных»."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/VoiceSalesAgent.exe --clobber
          else
            gh release create "$TAG" dist/VoiceSalesAgent.exe --title "Voice Sales Agent $TAG" --notes "$NOTES"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
