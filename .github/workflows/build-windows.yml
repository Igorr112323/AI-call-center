name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Run backend test suite
        shell: bash
        run: |
          set +e
          python -m pytest tests --ignore=tests/ui_smoke.py -q --junitxml=pytest.xml 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          if [ "$status" != "0" ]; then
            python -c "import xml.etree.ElementTree as ET; root=ET.parse('pytest.xml').getroot(); fails=[]; [fails.append((tc.get('classname','')+'.'+tc.get('name','')+': '+(el.text or '')[:400])) for tc in root.iter('testcase') for el in tc if el.tag in ('failure','error')]; print('::error title=pytest failures::' + ' || '.join(fails)[:1500])"
          fi
          exit $status

      - name: Render raster assets and application icon
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/build_assets.py

      - name: Headless self-check before packaging
        run: python run.py --selfcheck

      - name: Verify in-process SAPI voice (comtypes, no process spawn)
        shell: powershell
        run: |
          $py = @'
          import os
          import sys
          import tempfile
          import traceback
          try:
              sys.stdout.reconfigure(encoding="utf-8", errors="replace")
              import comtypes
              import comtypes.client as cc
              print("comtypes", getattr(comtypes, "__version__", "?"), flush=True)
              ru = "\u041f\u0440\u043e\u0432\u0435\u0440\u043a\u0430 \u0433\u043e\u043b\u043e\u0441\u043e\u0432\u043e\u0433\u043e \u0434\u0432\u0438\u0436\u043a\u0430"
              en = "Hello world, this is a voice engine test"

              def voice():
                  return cc.CreateObject("SAPI.SpVoice", dynamic=True)

              def file_case(text, with_format, flags=1):
                  fd, path = tempfile.mkstemp(suffix=".wav")
                  os.close(fd)
                  v = voice()
                  st = cc.CreateObject("SAPI.SpFileStream", dynamic=True)
                  if with_format:
                      fmt = cc.CreateObject("SAPI.SpAudioFormat", dynamic=True)
                      fmt.Type = 22
                      st.Format = fmt
                  st.Open(path, 3)
                  v.AudioOutputStream = st
                  bound = v.AudioOutputStream
                  ret = v.Speak(text, flags)
                  st.Close()
                  size = os.path.getsize(path)
                  os.unlink(path)
                  return f"size={size} speak_ret={ret} bound={bound is not None}"

              def mem_case(text, with_format):
                  v = voice()
                  st = cc.CreateObject("SAPI.SpMemoryStream", dynamic=True)
                  if with_format:
                      fmt = cc.CreateObject("SAPI.SpAudioFormat", dynamic=True)
                      fmt.Type = 22
                      st.Format = fmt
                  v.AudioOutputStream = st
                  ret = v.Speak(text, 1)
                  st.Seek(0, 0)
                  data = st.GetData()
                  n = len(data) if isinstance(data, (bytes, tuple, list)) else -1
                  return f"bytes={n} speak_ret={ret}"

              results = []
              cases = [
                  ("A file ru fmt", file_case, ru, True, 1),
                  ("B file ru nofmt", file_case, ru, False, 1),
                  ("C file en fmt", file_case, en, True, 1),
                  ("D file en flags0", file_case, en, True, 0),
                  ("E mem ru fmt", mem_case, ru, True),
                  ("F mem en nofmt", mem_case, en, False),
              ]
              for case in cases:
                  name, fn = case[0], case[1]
                  try:
                      line = f"{name} {fn(*case[2:])}"
                  except Exception as exc:
                      line = f"{name} ERROR {exc!r}"
                  print("RESULT", line, flush=True)
                  results.append(line)
              print("::warning title=SAPI matrix::" + " || ".join(results)[:1400], flush=True)
          except Exception:
              msg = " | ".join(traceback.format_exc().splitlines())[:1450]
              print(f"::error title=SAPI diagnostics failed::{msg}", flush=True)
              raise
          '@
          Set-Content -Path "$env:TEMP\sapi_native_smoke.py" -Value $py -Encoding utf8
          $env:PYTHONPATH = (Get-Location).Path
          $ErrorActionPreference = "Continue"
          $proc = Start-Process -FilePath "python" `
            -ArgumentList "-u `"$env:TEMP\sapi_native_smoke.py`"" `
            -Wait -PassThru -NoNewWindow `
            -RedirectStandardOutput "$env:TEMP\sapi_native.out" `
            -RedirectStandardError "$env:TEMP\sapi_native.err"
          $out = ((Get-Content "$env:TEMP\sapi_native.out", "$env:TEMP\sapi_native.err" `
            -ErrorAction SilentlyContinue) -join " | ")
          if ($proc.ExitCode -ne 0) {
            if ($out.Length -gt 1400) { $out = $out.Substring($out.Length - 1400) }
            Write-Host "::error title=SAPI native smoke failed::$out"
            throw "Native SAPI smoke failed (see annotation)"
          }
          Write-Host $out
      - name: Verify SAPI PowerShell fallback path
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Speech
          $out = Join-Path $env:TEMP "sapi_smoke.wav"
          $s = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $s.SetOutputToWaveFile($out)
          $s.Speak("Проверка голосового движка")
          $s.Dispose()
          if (-not (Test-Path $out) -or (Get-Item $out).Length -lt 1000) {
            throw "SAPI did not produce a valid WAV"
          }
          Write-Host "SAPI fallback OK, WAV size: $((Get-Item $out).Length) bytes"

      - name: Build onefile executable
        run: pyinstaller VoiceSalesAgent.spec --noconfirm

      - name: Smoke-run the packaged executable
        shell: powershell
        run: |
          $proc = Start-Process -FilePath ".\dist\VoiceSalesAgent.exe" `
            -ArgumentList "--selfcheck" -Wait -PassThru `
            -RedirectStandardOutput "selfcheck.out" -RedirectStandardError "selfcheck.err"
          Write-Host "exe selfcheck exit code: $($proc.ExitCode)"
          Get-Content selfcheck.out, selfcheck.err -ErrorAction SilentlyContinue
          if ($proc.ExitCode -ne 0) {
            $log = Join-Path $env:TEMP "voice_sales_selfcheck.log"
            if (Test-Path $log) {
              $joined = ((Get-Content $log) -join " | ")
              if ($joined.Length -gt 1500) { $joined = $joined.Substring(0, 1500) }
              Write-Host "::error::$joined"
            }
            throw "Packaged exe selfcheck failed"
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceSalesAgent-exe
          path: dist/VoiceSalesAgent.exe
          if-no-files-found: error

      - name: Publish GitHub release on tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" dist/VoiceSalesAgent.exe \
            --title "Voice Sales Agent $TAG" \
            --notes "Сборка Windows (.exe, onefile). Запустите VoiceSalesAgent.exe — установка не требуется. Демо без микрофона: кнопка «Текстовый тест», демо-каталоги во вкладке «Источник данных»."
        env:
          GH_TOKEN: ${{ github.token }}
