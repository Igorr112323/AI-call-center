name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Run backend test suite
        run: python -m pytest tests --ignore=tests/ui_smoke.py -q

      - name: Render raster assets and application icon
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/build_assets.py

      - name: Headless self-check before packaging
        run: python run.py --selfcheck

      - name: Build onefile executable
        run: pyinstaller VoiceSalesAgent.spec --noconfirm

      - name: Smoke-run the packaged executable
        shell: powershell
        run: |
          $proc = Start-Process -FilePath ".\dist\VoiceSalesAgent.exe" `
            -ArgumentList "--selfcheck" -Wait -PassThru -NoNewWindow
          Write-Host "exe selfcheck exit code: $($proc.ExitCode)"
          if ($proc.ExitCode -ne 0) { throw "Packaged exe selfcheck failed" }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceSalesAgent-exe
          path: dist/VoiceSalesAgent.exe
          if-no-files-found: error

      - name: Publish GitHub release on tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" dist/VoiceSalesAgent.exe \
            --title "Voice Sales Agent $TAG" \
            --notes "Сборка Windows (.exe, onefile). Запустите VoiceSalesAgent.exe — установка не требуется. Демо без микрофона: кнопка «Текстовый тест», демо-каталоги во вкладке «Источник данных»."
        env:
          GH_TOKEN: ${{ github.token }}
